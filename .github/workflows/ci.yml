# Tests on every push and pull request: both Go modules, vet, and gofmt.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test ./...
        working-directory: libraries/sql
      - run: go vet ./... && (cd libraries/sql && go vet ./...) && (cd cmd/fiig && go vet ./...)
      - name: gofmt
        run: test -z "$(gofmt -l compiler tooling cmd libraries)"
