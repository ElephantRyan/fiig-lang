# ADR 0090 §1a: one plugin for IntelliJ IDEA 2026.2 and 2026.3 (builds 262
# and 263). It compiles against the oldest and is verified against each.
pluginVersion = 0.1.0
platformVersion = 2026.2.5
verifyVersions = 2026.2.5, 2026.3
# To build against an installed IDE instead of downloading one, set
# localIde to its directory, e.g. in ~/.gradle/gradle.properties:
# localIde = C:/Program Files/JetBrains/IntelliJ IDEA 2026.2.0.1

org.gradle.jvmargs = -Xmx2g
kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
