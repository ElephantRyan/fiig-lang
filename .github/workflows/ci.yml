# Tests on every push and pull request: both Go modules, vet, and gofmt;
# and the IntelliJ plugin (ADR 0090): its tests and the Plugin Verifier.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: go test ./...
      - run: go test ./...
        working-directory: libraries/sql
      - run: go vet ./... && (cd libraries/sql && go vet ./...) && (cd cmd/fiig && go vet ./...)
      - name: gofmt
        run: test -z "$(gofmt -l compiler tooling cmd libraries)"

  # The race detector needs cgo, which the Windows development machines don't
  # have, so it runs here. The socket pool (ADR 0109), the stream and schedule
  # loops, and the driver pool are the concurrent code.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: go test -race ./...
      - run: go test -race ./...
        working-directory: libraries/sql

  intellij:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # The templates test runs `fiig check` on what each template makes.
      - run: go build -o "$RUNNER_TEMP/fiig" .
        working-directory: cmd/fiig
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, verify, and build the plugin
        working-directory: ide/intellij
        run: ./gradlew test verifyPlugin buildPlugin -PfiigBinary="$RUNNER_TEMP/fiig" --console=plain
